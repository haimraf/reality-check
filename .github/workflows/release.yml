name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'reality-check/SKILL.md'
